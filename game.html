<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Sports</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0d; overflow: hidden;
                 font-family: system-ui, -apple-system, sans-serif; }
    #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    /* The camera feed is never shown to the player; the debug overlay draws
       from it directly. It stays in the page because the tracker reads it. */
    #camera { position: fixed; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
    #start { position: fixed; left: 50%; top: 58%; transform: translate(-50%, -50%);
             font: 17px/1.2 system-ui, sans-serif; padding: 15px 30px; border-radius: 8px;
             border: 1px solid #f2efe9; background: transparent; color: #f2efe9; cursor: pointer; }
    #start:hover { background: rgba(242,239,233,0.1); }
    #start:disabled { opacity: 0.6; cursor: wait; }
    #status { position: fixed; left: 50%; bottom: 7%; transform: translateX(-50%);
              margin: 0; max-width: 70vw; text-align: center; font-size: 13px; line-height: 1.5;
              color: #8d8a86; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <video id="camera" playsinline muted></video>
  <button id="start">Start the camera</button>
  <p id="status" hidden></p>

  <script type="module" src="game/main.js"></script>
</body>
</html>
